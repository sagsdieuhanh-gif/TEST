name: TEST Regression Gate

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild generated runtime
        run: npm run build:runtime
      - name: Run regression suite on rebuilt runtime
        run: npm test
      - name: Commit regenerated runtime on fix branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/generated index.html service-worker.js asset-manifest.json
          if git diff --cached --quiet; then
            echo "Generated runtime already current."
            exit 0
          fi
          git commit -m "TEST: sync generated runtime after audit fixes"
          git push origin HEAD:${GITHUB_REF_NAME}
