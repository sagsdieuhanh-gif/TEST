name: One-shot reset TEST from E-REPORT-SAGS
on:
  push:
    branches: [sync-roster-family-20261005]
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild TEST from E-REPORT-SAGS source baseline
        shell: bash
        run: |
          set -euo pipefail
          cp tools/apply-test-roster-policy.cjs /tmp/apply-test-roster-policy.cjs
          EXPECTED_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          git fetch https://github.com/sagsdieuhanh-gif/E-REPORT-SAGS.git main:refs/remotes/source/main
          git checkout -B final "$EXPECTED_MAIN"
          git rm -r -f --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive refs/remotes/source/main | tar -x
          node /tmp/apply-test-roster-policy.cjs
          node tests/roster-stable-family.test.cjs
          # GITHUB_TOKEN cannot change workflow files. Keep current workflows unchanged for this one push;
          # they are replaced in one clean follow-up commit by the GitHub connector.
          rm -rf .github/workflows
          git checkout "$EXPECTED_MAIN" -- .github/workflows || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reset TEST from E-REPORT-SAGS V6.4.88 and lock roster form family [skip ci]"
          git push origin HEAD:main
