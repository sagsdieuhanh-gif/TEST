name: UI Phase Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-phase-preview.yml"
      - "preview-target.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-phase-preview-main
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main as preview root
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Read preview target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          branch="$(tr -d '\r\n' < site/preview-target.txt)"
          if [[ ! "$branch" =~ ^ui-redesign-phase([0-9]+)$ ]]; then
            echo "Invalid preview branch: $branch" >&2
            exit 1
          fi
          n="${BASH_REMATCH[1]}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "phase=$n" >> "$GITHUB_OUTPUT"

      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          path: phase

      - name: Prepare isolated phase preview
        shell: bash
        run: |
          set -euo pipefail
          target="site/previews/phase-${{ steps.target.outputs.phase }}"
          mkdir -p "$target"
          rsync -a --delete             --exclude '.git'             --exclude '.github'             --exclude 'node_modules'             phase/ "$target/"
          touch site/.nojekyll
          echo "PREVIEW_PATH=previews/phase-${{ steps.target.outputs.phase }}/" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print preview URL
        shell: bash
        run: echo "${{ steps.deployment.outputs.page_url }}${PREVIEW_PATH}"
