name: Optimize TEST Startup

on:
  push:
    branches: [main]
    paths:
      - "tools/optimize-test-startup.cjs"
      - ".github/workflows/optimize-test-startup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/optimize-test-startup.cjs
      - name: Commit optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No optimization changes."
            exit 0
          fi
          git commit -m "TEST: optimize startup requests and legacy payload"
          git push origin HEAD:main
