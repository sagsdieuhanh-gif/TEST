name: Deploy TEST GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: test-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable roster form-family policy
        run: node tests/roster-stable-family.test.cjs
      - name: Verify Firebase account registration
        run: node tests/firebase-account-registration-v6498.test.cjs
      - name: Verify home airline UI and receive speed
        run: node tests/home-airline-speed-v64100.test.cjs
      - name: Verify UI performance guards
        run: node tests/performance-v6499.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
