name: Deploy TEST GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: test-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable roster form-family policy
        run: node tests/roster-stable-family.test.cjs
      - name: Verify Firebase account registration
        run: node tests/firebase-account-registration-v6498.test.cjs
      - name: Verify AD session stability
        run: node tests/ad-session-stability.test.cjs
      - name: Verify admin account lifecycle
        run: node tests/admin-account-actions-v2.test.cjs
      - name: Verify home airline UI and receive speed
        run: node tests/home-airline-speed-v64100.test.cjs
      - name: Verify UI performance guards
        run: node tests/performance-v6499.test.cjs
      - name: Verify auto-sign session and owner guards
        run: node tests/auto-sign-context-v64101.test.cjs
      - name: Verify carousel identity and logo coverage
        run: node tests/home-carousel-v64101.test.cjs
      - name: Verify supervisor all-flight scope and AD contrast
        run: |
          node tests/home-overview-owner.test.cjs
          node tests/v64102-supervisor-scope.test.cjs
      - name: Verify V6.4.103 dashboard fidelity
        run: node tests/v64103-dashboard-fidelity.test.cjs
      - name: Verify V6.4.104 mobile row and performance cleanup
        run: node tests/v64104-mobile-perf-cleanup.test.cjs
      - name: Verify V6.4.105 MY FLIGHT stability
        run: node tests/v64105-myflight-stability.test.cjs
      - name: Verify V6.4.106 compact chips and stability
        run: node tests/v64106-myflight-chip-stability.test.cjs
      - name: Verify V2.0 quick-entry full expansion
        run: node tests/v2-quick-customize.test.cjs
      - name: Verify V2.0 flight dossier unit overview
        run: node tests/v2-myflight-dossier.test.cjs
      - name: Verify V2.0 three-layer draft protection
        run: node tests/v2-draft-sync.test.cjs
      - name: Verify AD realtime flight search
        run: node tests/flight-search.test.cjs
      - name: Verify Settings Center contract
        run: node tests/v21-settings-center.test.cjs
      - name: Verify avatar identity and responsive Settings
        run: node tests/v24-avatar-responsive-settings.test.cjs
      - name: Verify pinned cache integrity
        run: node tests/pwa-staging.test.cjs
      - name: Verify TEST stays on GitHub Pages
        run: node tests/test-pages-no-production-redirect.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
